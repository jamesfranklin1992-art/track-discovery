<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Discovery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --bg2: #161616;
    --bg3: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e6e0;
    --text2: #8a8880;
    --text3: #555350;
    --accent: #c8b89a;
    --accent2: #7c6c54;
    --heard: #4a9a7c;
    --want: #9a7a4a;
    --downloaded: #4a6a9a;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }

  /* Layout */
  #app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    background: var(--bg);
    position: relative; z-index: 100;
  }
  .site-title {
    font-family: var(--mono); font-size: 12px; font-weight: 400;
    color: var(--accent); letter-spacing: .1em; text-transform: uppercase;
    margin-right: 32px; white-space: nowrap;
  }
  nav { display: flex; gap: 0; }
  .nav-btn {
    font-family: var(--mono); font-size: 11px; font-weight: 400;
    color: var(--text3); letter-spacing: .06em; text-transform: uppercase;
    padding: 0 16px; height: 48px; border: none; background: transparent;
    cursor: pointer; border-right: 1px solid var(--border);
    transition: color .15s, background .15s;
    white-space: nowrap;
  }
  .nav-btn:first-child { border-left: 1px solid var(--border); }
  .nav-btn:hover { color: var(--text); background: var(--bg3); }
  .nav-btn.active { color: var(--accent); background: var(--bg2); }

  .header-right {
    margin-left: auto; display: flex; align-items: center; gap: 16px;
  }
  .track-count { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  /* Search */
  .search-wrap { position: relative; }
  #search {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    background: var(--bg3); border: 1px solid var(--border);
    padding: 5px 10px 5px 28px; border-radius: 3px; width: 200px;
    outline: none; transition: border-color .15s;
  }
  #search::placeholder { color: var(--text3); }
  #search:focus { border-color: var(--border2); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 12px; pointer-events: none; }

  /* Panels */
  .panel { display: none; height: 100%; overflow: hidden; }
  .panel.active { display: flex; }

  /* ── TIMELINE ── */
  #panel-timeline { flex-direction: row; }
  .tl-sidebar {
    width: 200px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px 0;
  }
  .tl-sidebar::-webkit-scrollbar { width: 0; }
  .tl-month-btn {
    display: block; width: 100%; text-align: left;
    font-family: var(--mono); font-size: 11px; color: var(--text3);
    padding: 6px 16px; border: none; background: transparent;
    cursor: pointer; transition: color .15s, background .15s;
    letter-spacing: .04em;
  }
  .tl-month-btn:hover { color: var(--text); background: var(--bg3); }
  .tl-month-btn.active { color: var(--accent); }
  .tl-month-count { float: right; color: var(--text3); font-size: 10px; }

  .tl-main { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .tl-main::-webkit-scrollbar { width: 4px; }
  .tl-main::-webkit-scrollbar-track { background: transparent; }
  .tl-main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .tl-section { margin-bottom: 40px; }
  .tl-section-head {
    font-family: var(--mono); font-size: 10px; color: var(--text3);
    letter-spacing: .12em; text-transform: uppercase;
    margin-bottom: 16px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  .tl-section-head span { font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: 0; }
  .tl-tracks { display: flex; flex-direction: column; gap: 1px; }
  .track-row {
    display: flex; align-items: baseline; gap: 12px;
    padding: 8px 12px; border-radius: 3px;
    cursor: pointer; transition: background .12s;
    position: relative;
  }
  .track-row:hover { background: var(--bg3); }
  .track-row.selected { background: var(--bg2); }
  .tr-day { font-family: var(--mono); font-size: 10px; color: var(--text3); width: 24px; flex-shrink: 0; }
  .tr-title { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-artist { font-size: 12px; color: var(--text2); white-space: nowrap; }
  .tr-badges { display: flex; gap: 4px; flex-shrink: 0; }
  .badge {
    font-family: var(--mono); font-size: 9px; letter-spacing: .04em;
    padding: 2px 5px; border-radius: 2px; white-space: nowrap;
  }
  .badge-genre { background: rgba(200,184,154,0.1); color: var(--accent2); border: 1px solid rgba(200,184,154,0.2); }
  .badge-mood-club { background: rgba(74,154,124,0.1); color: #4a9a7c; border: 1px solid rgba(74,154,124,0.2); }
  .badge-mood-bar { background: rgba(154,122,74,0.1); color: #9a7a4a; border: 1px solid rgba(154,122,74,0.2); }
  .badge-mood-easy { background: rgba(74,106,154,0.1); color: #4a6a9a; border: 1px solid rgba(74,106,154,0.2); }
  .badge-status-heard { color: var(--heard); }
  .badge-status-want { color: var(--want); }
  .badge-status-downloaded { color: var(--downloaded); }

  /* ── GRAPH ── */
  #panel-graph { flex-direction: column; position: relative; }
  #graph-svg { width: 100%; height: 100%; }
  .graph-controls {
    position: absolute; top: 16px; left: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .graph-filter-btn {
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text3);
    background: var(--bg2); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .graph-filter-btn:hover { color: var(--text); border-color: var(--border2); }
  .graph-filter-btn.active { color: var(--accent); border-color: var(--accent2); background: rgba(200,184,154,0.06); }
  .graph-legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 10;
    display: flex; flex-direction: column; gap: 5px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; color: var(--text3); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .node-track circle { fill: rgba(200,184,154,0.5); stroke: rgba(200,184,154,0.3); stroke-width: 1; cursor: pointer; transition: r .2s; }
  .node-track:hover circle { fill: var(--accent); }
  .node-label circle { fill: rgba(74,154,124,0.6); stroke: rgba(74,154,124,0.4); stroke-width: 1; cursor: pointer; }
  .node-source circle { fill: rgba(74,106,154,0.6); stroke: rgba(74,106,154,0.4); stroke-width: 1; cursor: pointer; }
  .node-genre circle { fill: rgba(154,100,74,0.6); stroke: rgba(154,100,74,0.4); stroke-width: 1; cursor: pointer; }
  .node-sourcedetail circle { fill: rgba(154,122,74,0.6); stroke: rgba(154,122,74,0.4); stroke-width: 1; cursor: pointer; }
  .graph-link { stroke: rgba(255,255,255,0.05); stroke-width: 1; }
  .graph-link.highlighted { stroke: rgba(200,184,154,0.5); stroke-width: 1.5; }
  .node-label-text { font-family: var(--mono); font-size: 10px; fill: var(--text2); pointer-events: none; }
  .graph-tooltip {
    position: absolute; pointer-events: none;
    background: var(--bg2); border: 1px solid var(--border2);
    padding: 8px 12px; border-radius: 4px; z-index: 20;
    font-family: var(--mono); font-size: 11px; color: var(--text);
    max-width: 240px; display: none;
  }
  .graph-tooltip .tt-title { font-weight: 500; color: var(--accent); margin-bottom: 3px; }
  .graph-tooltip .tt-sub { color: var(--text2); font-size: 10px; }

  /* ── LABELS / SOURCE ── */
  #panel-labels, #panel-sources { flex-direction: row; }
  .group-sidebar {
    width: 220px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px 0;
  }
  .group-sidebar::-webkit-scrollbar { width: 0; }
  .group-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 7px 16px;
    font-family: var(--mono); font-size: 11px; color: var(--text3);
    background: transparent; border: none; cursor: pointer;
    transition: color .15s, background .15s; text-align: left;
    letter-spacing: .02em;
  }
  .group-btn:hover { color: var(--text); background: var(--bg3); }
  .group-btn.active { color: var(--accent); background: var(--bg2); }
  .group-btn-count { font-size: 10px; color: var(--text3); flex-shrink: 0; margin-left: 8px; }
  .group-main { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .group-main::-webkit-scrollbar { width: 4px; }
  .group-main::-webkit-scrollbar-track { background: transparent; }
  .group-main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .group-header {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    letter-spacing: .06em; margin-bottom: 20px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .group-header-count { font-size: 10px; color: var(--text3); letter-spacing: 0; }

  /* ── DETAIL PANEL ── */
  #detail-panel {
    position: fixed; right: 0; top: 48px; bottom: 0; width: 320px;
    background: var(--bg2); border-left: 1px solid var(--border2);
    z-index: 50; transform: translateX(100%); transition: transform .2s;
    overflow-y: auto; padding: 24px 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  #detail-panel.open { transform: translateX(0); }
  #detail-panel::-webkit-scrollbar { width: 0; }
  .detail-close {
    position: absolute; top: 12px; right: 12px;
    font-family: var(--mono); font-size: 11px; color: var(--text3);
    background: transparent; border: none; cursor: pointer;
    padding: 4px 8px; border-radius: 3px; transition: color .15s;
  }
  .detail-close:hover { color: var(--text); }
  .detail-title { font-size: 16px; font-weight: 500; color: var(--text); line-height: 1.3; margin-right: 24px; }
  .detail-artist { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-top: 4px; }
  .detail-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .detail-row { display: flex; gap: 8px; align-items: baseline; }
  .detail-label { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: .06em; text-transform: uppercase; width: 80px; flex-shrink: 0; }
  .detail-val { font-size: 12px; color: var(--text2); }
  .detail-val.clickable { cursor: pointer; color: var(--accent2); text-decoration: underline; text-underline-offset: 2px; }
  .detail-val.clickable:hover { color: var(--accent); }
  .detail-links { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .detail-link {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    color: var(--text3); border: 1px solid var(--border2);
    padding: 4px 10px; border-radius: 3px; text-decoration: none;
    transition: color .15s, border-color .15s;
  }
  .detail-link:hover { color: var(--accent); border-color: var(--accent2); }
  .detail-notes {
    font-size: 12px; color: var(--text2); line-height: 1.6;
    background: var(--bg3); border: 1px solid var(--border);
    padding: 10px 12px; border-radius: 4px; margin-top: 4px;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }

  /* Filters toolbar */
  .filters-bar {
    padding: 10px 32px; border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    background: var(--bg);
  }
  .filter-label { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: .06em; }
  .filter-chip {
    font-family: var(--mono); font-size: 10px; color: var(--text3);
    background: transparent; border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 2px; cursor: pointer;
    transition: all .15s; letter-spacing: .03em;
  }
  .filter-chip:hover { color: var(--text); border-color: var(--border2); }
  .filter-chip.active { color: var(--accent); border-color: var(--accent2); background: rgba(200,184,154,0.06); }
  .filter-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

  /* Sort select */
  .sort-select {
    font-family: var(--mono); font-size: 10px; color: var(--text3);
    background: transparent; border: 1px solid var(--border);
    padding: 3px 6px; border-radius: 2px; cursor: pointer; outline: none;
    letter-spacing: .03em; margin-left: auto;
  }
  .sort-select option { background: var(--bg2); color: var(--text); }

  .empty { font-family: var(--mono); font-size: 11px; color: var(--text3); padding: 32px; }

  /* ── FILTERS panel wrap ── */
  .panel-inner-wrap { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .panel-inner-content { flex: 1; display: flex; overflow: hidden; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="site-title">Track Discovery</div>
    <nav>
      <button class="nav-btn active" data-panel="timeline">Timeline</button>
      <button class="nav-btn" data-panel="graph">Graph</button>
      <button class="nav-btn" data-panel="labels">Labels</button>
      <button class="nav-btn" data-panel="sources">Sources</button>
    </nav>
    <div class="header-right">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search" type="text" placeholder="search tracks, artists...">
      </div>
      <div class="track-count" id="track-count"></div>
    </div>
  </header>

  <!-- TIMELINE -->
  <div class="panel active" id="panel-timeline">
    <div class="panel-inner-wrap" style="width:200px;flex-shrink:0;border-right:1px solid var(--border);">
      <div class="tl-sidebar" id="tl-sidebar"></div>
    </div>
    <div class="panel-inner-wrap" style="flex:1">
      <div class="filters-bar" id="tl-filters"></div>
      <div class="tl-main" id="tl-main"></div>
    </div>
  </div>

  <!-- GRAPH -->
  <div class="panel" id="panel-graph">
    <div class="graph-controls" id="graph-controls"></div>
    <div class="graph-legend" id="graph-legend"></div>
    <svg id="graph-svg"></svg>
    <div class="graph-tooltip" id="graph-tooltip"></div>
  </div>

  <!-- LABELS -->
  <div class="panel" id="panel-labels">
    <div class="panel-inner-wrap" style="width:220px;flex-shrink:0;border-right:1px solid var(--border);">
      <div class="group-sidebar" id="labels-sidebar"></div>
    </div>
    <div class="panel-inner-wrap" style="flex:1">
      <div class="filters-bar" id="labels-filters"></div>
      <div class="group-main" id="labels-main"></div>
    </div>
  </div>

  <!-- SOURCES -->
  <div class="panel" id="panel-sources">
    <div class="panel-inner-wrap" style="width:220px;flex-shrink:0;border-right:1px solid var(--border);">
      <div class="group-sidebar" id="sources-sidebar"></div>
    </div>
    <div class="panel-inner-wrap" style="flex:1">
      <div class="filters-bar" id="sources-filters"></div>
      <div class="group-main" id="sources-main"></div>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div id="detail-panel">
  <button class="detail-close" onclick="closeDetail()">✕ close</button>
  <div id="detail-content"></div>
</div>

// ── State ──
let activePanel = 'timeline';
let searchQ = '';
let selectedTrack = null;
let tlFilter = { genre: null, mood: null, status: null };
let labelsFilter = { genre: null, mood: null };
let sourcesFilter = { genre: null, mood: null };
let tlSort = 'date-desc';
let groupSort = 'count-desc';

// ── Derived data ──
function parseDate(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length !== 3) return null;
  return new Date(+p[2], +p[1]-1, +p[0]);
}

TRACKS.forEach(t => { t._date = parseDate(t.dateHeard); });

function filtered(tracks, overrides) {
  const q = searchQ.toLowerCase();
  return tracks.filter(t => {
    if (q && !`${t.title} ${t.artist} ${t.label||''} ${t.genre||''} ${t.source||''} ${t.sourceDetail||''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── Nav ──
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activePanel = btn.dataset.panel;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + activePanel).classList.add('active');
    closeDetail();
    if (activePanel === 'graph') initGraph();
  });
});

// ── Search ──
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value;
  renderAll();
});

// ── Detail ──
function openDetail(track) {
  selectedTrack = track;
  const sc = { Heard: '#4a9a7c', Want: '#9a7a4a', Downloaded: '#4a6a9a' };
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-title">${esc(track.title)}</div>
    <div class="detail-artist">${esc(track.artist)}</div>
    <div class="detail-grid" style="margin-top:16px">
      ${track.label ? `<div class="detail-row"><div class="detail-label">Label</div><div class="detail-val clickable" onclick="filterByLabel('${esc(track.label).replace(/'/g,"&apos;")}')">${esc(track.label)}</div></div>` : ''}
      ${track.year ? `<div class="detail-row"><div class="detail-label">Year</div><div class="detail-val">${esc(track.year)}</div></div>` : ''}
      ${track.genre ? `<div class="detail-row"><div class="detail-label">Genre</div><div class="detail-val">${esc(track.genre)}</div></div>` : ''}
      ${track.mood ? `<div class="detail-row"><div class="detail-label">Mood</div><div class="detail-val">${esc(track.mood)}</div></div>` : ''}
      ${track.source ? `<div class="detail-row"><div class="detail-label">Source</div><div class="detail-val clickable" onclick="filterBySource('${esc(track.source).replace(/'/g,"&apos;")}')">${esc(track.source)}</div></div>` : ''}
      ${track.sourceDetail ? `<div class="detail-row"><div class="detail-label">Via</div><div class="detail-val">${esc(track.sourceDetail)}</div></div>` : ''}
      ${track.dateHeard ? `<div class="detail-row"><div class="detail-label">Heard</div><div class="detail-val">${esc(track.dateHeard)}</div></div>` : ''}
      ${track.status ? `<div class="detail-row"><div class="detail-label">Status</div><div class="detail-val"><span class="status-dot" style="background:${sc[track.status]||'#888'}"></span>${esc(track.status)}</div></div>` : ''}
    </div>
    ${track.notes ? `<div class="detail-notes">${esc(track.notes)}</div>` : ''}
    <div class="detail-links">
      ${track.bandcamp ? `<a class="detail-link" href="${track.bandcamp}" target="_blank">Bandcamp ↗</a>` : ''}
      ${track.discogs ? `<a class="detail-link" href="${track.discogs}" target="_blank">Discogs ↗</a>` : ''}
    </div>
  `;
  document.getElementById('detail-panel').classList.add('open');
}

function closeDetail() {
  selectedTrack = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.track-row').forEach(r => r.classList.remove('selected'));
}

function filterByLabel(l) {
  closeDetail();
  document.querySelector('[data-panel="labels"]').click();
  setTimeout(() => selectGroupItem('labels', l), 50);
}
function filterBySource(s) {
  closeDetail();
  document.querySelector('[data-panel="sources"]').click();
  setTimeout(() => selectGroupItem('sources', s), 50);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Badge helpers ──
function moodBadge(mood) {
  if (!mood) return '';
  const cls = mood === 'Club' ? 'badge-mood-club' : mood === 'Bar' ? 'badge-mood-bar' : 'badge-mood-easy';
  return `<span class="badge ${cls}">${esc(mood)}</span>`;
}
function genreBadge(genre) {
  if (!genre) return '';
  return `<span class="badge badge-genre">${esc(genre)}</span>`;
}

// ── TIMELINE ──
function renderTimeline() {
  const tracks = filtered(TRACKS);
  document.getElementById('track-count').textContent = `${tracks.length} tracks`;

  // Build filters bar
  const genres = [...new Set(TRACKS.filter(t=>t.genre).map(t=>t.genre))].sort();
  const moods = ['Bar','Club','Easy Listening'];
  const statuses = ['Heard','Want','Downloaded'];

  document.getElementById('tl-filters').innerHTML = `
    <span class="filter-label">Genre</span>
    ${genres.map(g => `<button class="filter-chip${tlFilter.genre===g?' active':''}" onclick="setTLFilter('genre','${g}')">${g}</button>`).join('')}
    <div class="filter-sep"></div>
    <span class="filter-label">Mood</span>
    ${moods.map(m => `<button class="filter-chip${tlFilter.mood===m?' active':''}" onclick="setTLFilter('mood','${m}')">${m}</button>`).join('')}
    <div class="filter-sep"></div>
    <span class="filter-label">Status</span>
    ${statuses.map(s => `<button class="filter-chip${tlFilter.status===s?' active':''}" onclick="setTLFilter('status','${s}')">${s}</button>`).join('')}
    <select class="sort-select" onchange="tlSort=this.value;renderTimeline()">
      <option value="date-desc"${tlSort==='date-desc'?' selected':''}>Newest first</option>
      <option value="date-asc"${tlSort==='date-asc'?' selected':''}>Oldest first</option>
      <option value="alpha"${tlSort==='alpha'?' selected':''}>A–Z</option>
    </select>
  `;

  let display = tracks.filter(t => {
    if (tlFilter.genre && t.genre !== tlFilter.genre) return false;
    if (tlFilter.mood && t.mood !== tlFilter.mood) return false;
    if (tlFilter.status && t.status !== tlFilter.status) return false;
    return true;
  });

  if (tlSort === 'date-desc') display.sort((a,b) => (b._date||0) - (a._date||0));
  else if (tlSort === 'date-asc') display.sort((a,b) => (a._date||0) - (b._date||0));
  else display.sort((a,b) => a.title.localeCompare(b.title));

  // Group by month
  const groups = {};
  const nodate = [];
  display.forEach(t => {
    if (t._date) {
      const key = t._date.getFullYear() + '-' + String(t._date.getMonth()+1).padStart(2,'0');
      if (!groups[key]) groups[key] = [];
      groups[key].push(t);
    } else {
      nodate.push(t);
    }
  });

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const keys = Object.keys(groups).sort((a,b) => tlSort==='date-asc' ? a.localeCompare(b) : b.localeCompare(a));

  // Sidebar
  const sidebarHTML = keys.map(k => {
    const [y,m] = k.split('-');
    return `<button class="tl-month-btn" onclick="scrollToMonth('${k}')">${months[+m-1]} ${y} <span class="tl-month-count">${groups[k].length}</span></button>`;
  }).join('');
  document.getElementById('tl-sidebar').innerHTML = sidebarHTML || '<div class="empty">No months</div>';

  // Main
  let mainHTML = '';
  keys.forEach(k => {
    const [y,m] = k.split('-');
    mainHTML += `<div class="tl-section" id="month-${k}">
      <div class="tl-section-head">${months[+m-1]} <span>${y}</span> <span style="margin-left:auto;font-size:10px">${groups[k].length} tracks</span></div>
      <div class="tl-tracks">
        ${groups[k].map(t => trackRow(t)).join('')}
      </div>
    </div>`;
  });
  if (nodate.length) {
    mainHTML += `<div class="tl-section" id="month-none">
      <div class="tl-section-head">Undated</div>
      <div class="tl-tracks">${nodate.map(t => trackRow(t)).join('')}</div>
    </div>`;
  }
  if (!mainHTML) mainHTML = '<div class="empty">No tracks match.</div>';
  document.getElementById('tl-main').innerHTML = mainHTML;
}

function trackRow(t) {
  const day = t._date ? t._date.getDate() : '';
  return `<div class="track-row${selectedTrack===t?' selected':''}" onclick="openDetail(TRACKS[${TRACKS.indexOf(t)}])">
    <span class="tr-day">${day}</span>
    <span class="tr-title">${esc(t.title)}</span>
    <span class="tr-artist">${esc(t.artist)}</span>
    <span class="tr-badges">
      ${genreBadge(t.genre)}
      ${moodBadge(t.mood)}
    </span>
  </div>`;
}

window.setTLFilter = (key, val) => {
  tlFilter[key] = tlFilter[key] === val ? null : val;
  renderTimeline();
};
window.scrollToMonth = (key) => {
  const el = document.getElementById('month-' + key);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// ── GROUPS (Labels / Sources) ──
let activeLabel = null;
let activeSource = null;

function renderGroupPanel(type) {
  const isLabel = type === 'labels';
  const field = isLabel ? 'label' : 'source';
  const filterState = isLabel ? labelsFilter : sourcesFilter;
  const activeItem = isLabel ? activeLabel : activeSource;
  const tracks = filtered(TRACKS);

  // Build group map
  const groups = {};
  tracks.forEach(t => {
    const key = t[field];
    if (!key) return;
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  const genres = [...new Set(TRACKS.filter(t=>t.genre).map(t=>t.genre))].sort();
  const moods = ['Bar','Club','Easy Listening'];

  // Filters
  document.getElementById(`${type}-filters`).innerHTML = `
    <span class="filter-label">Genre</span>
    ${genres.map(g => `<button class="filter-chip${filterState.genre===g?' active':''}" onclick="setGroupFilter('${type}','genre','${g}')">${g}</button>`).join('')}
    <div class="filter-sep"></div>
    <span class="filter-label">Mood</span>
    ${moods.map(m => `<button class="filter-chip${filterState.mood===m?' active':''}" onclick="setGroupFilter('${type}','mood','${m}')">${m}</button>`).join('')}
    <select class="sort-select" onchange="groupSort=this.value;renderGroupPanel('${type}')">
      <option value="count-desc"${groupSort==='count-desc'?' selected':''}>Most tracks</option>
      <option value="alpha"${groupSort==='alpha'?' selected':''}>A–Z</option>
    </select>
  `;

  let keys = Object.keys(groups);
  if (groupSort === 'count-desc') keys.sort((a,b) => groups[b].length - groups[a].length);
  else keys.sort((a,b) => a.localeCompare(b));

  // Sidebar
  document.getElementById(`${type}-sidebar`).innerHTML = keys.map(k =>
    `<button class="group-btn${activeItem===k?' active':''}" onclick="selectGroupItem('${type}','${k.replace(/'/g,"\'")}')">${esc(k)}<span class="group-btn-count">${groups[k].length}</span></button>`
  ).join('');

  // Main
  const current = activeItem && groups[activeItem] ? activeItem : keys[0];
  if (!current || !groups[current]) {
    document.getElementById(`${type}-main`).innerHTML = '<div class="empty">Select an item from the sidebar.</div>';
    return;
  }
  if (isLabel) activeLabel = current; else activeSource = current;

  let display = groups[current].filter(t => {
    if (filterState.genre && t.genre !== filterState.genre) return false;
    if (filterState.mood && t.mood !== filterState.mood) return false;
    return true;
  });
  display.sort((a,b) => (b._date||0)-(a._date||0));

  document.getElementById(`${type}-main`).innerHTML = `
    <div class="group-header">${esc(current)} <span class="group-header-count">${display.length} track${display.length!==1?'s':''}</span></div>
    <div class="tl-tracks">${display.map(t => trackRow(t)).join('')}</div>
  `;
}

window.setGroupFilter = (type, key, val) => {
  const fs = type === 'labels' ? labelsFilter : sourcesFilter;
  fs[key] = fs[key] === val ? null : val;
  renderGroupPanel(type);
};
window.selectGroupItem = (type, key) => {
  if (type === 'labels') activeLabel = key; else activeSource = key;
  renderGroupPanel(type);
};

// ── GRAPH ──
let graphInit = false;

// Which hub types are active — default source + genre + mood
const graphLayers = { source: true, genre: true, mood: true, label: false, sourcedetail: false, decade: false, status: false };

// Year → decade bucket
function decadeOf(t) {
  const y = parseInt(t.year);
  if (!y || isNaN(y)) return null;
  return (Math.floor(y / 10) * 10) + 's';
}

// Node colours per layer type
const LAYER_META = {
  source:       { field: 'source',       label: 'Source',        color: '#4a6a9a', colorA: 'rgba(74,106,154,0.18)',  stroke: 'rgba(74,106,154,0.5)'  },
  genre:        { field: 'genre',        label: 'Genre',         color: '#9a644a', colorA: 'rgba(154,100,74,0.18)',  stroke: 'rgba(154,100,74,0.5)'  },
  mood:         { field: 'mood',         label: 'Mood',          color: '#7a4a9a', colorA: 'rgba(122,74,154,0.18)',  stroke: 'rgba(122,74,154,0.5)'  },
  label:        { field: 'label',        label: 'Label',         color: '#4a9a7c', colorA: 'rgba(74,154,124,0.18)',  stroke: 'rgba(74,154,124,0.5)'  },
  sourcedetail: { field: 'sourceDetail', label: 'Source detail', color: '#9a7a4a', colorA: 'rgba(154,122,74,0.18)',  stroke: 'rgba(154,122,74,0.5)'  },
  decade:       { field: '_decade',      label: 'Decade',        color: '#9a4a6a', colorA: 'rgba(154,74,106,0.18)',  stroke: 'rgba(154,74,106,0.5)'  },
  status:       { field: 'status',       label: 'Status',        color: '#6a9a4a', colorA: 'rgba(106,154,74,0.18)',  stroke: 'rgba(106,154,74,0.5)'  },
};

// Link colours per hub type
const LINK_COLOR = {
  source:       'rgba(74,106,154,0.22)',
  genre:        'rgba(154,100,74,0.22)',
  mood:         'rgba(122,74,154,0.22)',
  label:        'rgba(74,154,124,0.22)',
  sourcedetail: 'rgba(154,122,74,0.22)',
  decade:       'rgba(154,74,106,0.22)',
  status:       'rgba(106,154,74,0.22)',
};

function initGraph() {
  if (!window.d3) return;
  const svg = d3.select('#graph-svg');
  svg.selectAll('*').remove();
  graphInit = true;

  const W = document.getElementById('panel-graph').clientWidth;
  const H = document.getElementById('panel-graph').clientHeight;
  svg.attr('width', W).attr('height', H);

  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.15, 5]).on('zoom', e => g.attr('transform', e.transform)));

  renderGraphControls();
  renderGraphLegend();
  buildGraph(g, W, H);
}

function renderGraphControls() {
  document.getElementById('graph-controls').innerHTML =
    Object.entries(LAYER_META).map(([id, m]) =>
      `<button class="graph-filter-btn${graphLayers[id]?' active':''}"
        style="${graphLayers[id]?`color:${m.color};border-color:${m.color};background:${m.colorA}`:''}"
        onclick="toggleLayer('${id}')">${m.label}</button>`
    ).join('');
}

function renderGraphLegend() {
  const active = Object.entries(graphLayers).filter(([,v])=>v);
  document.getElementById('graph-legend').innerHTML =
    `<div class="legend-item"><div class="legend-dot" style="background:rgba(200,184,154,0.7)"></div>Track</div>` +
    active.map(([id]) => {
      const m = LAYER_META[id];
      return `<div class="legend-item"><div class="legend-dot" style="background:${m.color}"></div>${m.label}</div>`;
    }).join('');
}

window.toggleLayer = (id) => {
  const active = Object.values(graphLayers).filter(Boolean).length;
  // require at least one layer
  if (graphLayers[id] && active === 1) return;
  graphLayers[id] = !graphLayers[id];
  renderGraphControls();
  renderGraphLegend();
  const svg = d3.select('#graph-svg');
  svg.selectAll('*').remove();
  const g = svg.append('g');
  const W = +svg.attr('width'), H = +svg.attr('height');
  svg.call(d3.zoom().scaleExtent([0.15, 5]).on('zoom', e => g.attr('transform', e.transform)));
  buildGraph(g, W, H);
};

function buildGraph(g, W, H) {
  const tracks = filtered(TRACKS);

  // Stamp computed fields onto tracks for this render
  tracks.forEach(t => { t._decade = decadeOf(t); });

  // Build hub nodes for each active layer
  const hubMap = {}; // key -> node
  const activeLayers = Object.entries(graphLayers).filter(([,v])=>v).map(([id])=>id);

  activeLayers.forEach(layerId => {
    const { field } = LAYER_META[layerId];
    tracks.forEach(t => {
      const val = t[field];
      if (!val) return;
      const key = layerId + ':' + val;
      if (!hubMap[key]) hubMap[key] = { id: key, name: val, hubType: layerId, count: 0 };
      hubMap[key].count++;
    });
  });

  // Cap very large hub lists per layer to keep it readable
  const MAX_HUBS_PER_LAYER = 40;
  const hubsByLayer = {};
  activeLayers.forEach(lid => {
    hubsByLayer[lid] = Object.values(hubMap)
      .filter(h => h.hubType === lid)
      .sort((a,b) => b.count - a.count)
      .slice(0, MAX_HUBS_PER_LAYER);
  });
  const usedHubs = new Set(Object.values(hubsByLayer).flat().map(h => h.id));
  const hubList = Object.values(hubMap).filter(h => usedHubs.has(h.id));

  // Track nodes — only those connected to ≥1 used hub
  const MAX_TRACKS = 350;
  const connectedTracks = tracks.filter(t =>
    activeLayers.some(lid => {
      const val = t[LAYER_META[lid].field];
      return val && usedHubs.has(lid + ':' + val);
    })
  );
  const trackSample = connectedTracks.length > MAX_TRACKS
    ? connectedTracks.sort(() => Math.random() - 0.5).slice(0, MAX_TRACKS)
    : connectedTracks;

  const trackNodes = trackSample.map(t => ({
    id: 'track:' + t.title + ':' + t.artist,
    name: t.title, artist: t.artist, type: 'track', track: t
  }));

  const nodes = [...hubList, ...trackNodes];

  // Links — one per (track, active layer value) pair
  const links = [];
  trackSample.forEach(t => {
    activeLayers.forEach(lid => {
      const val = t[LAYER_META[lid].field];
      const hubKey = lid + ':' + val;
      if (val && usedHubs.has(hubKey)) {
        links.push({
          source: 'track:' + t.title + ':' + t.artist,
          target: hubKey,
          hubType: lid,
        });
      }
    });
  });

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id)
      .distance(d => d.target.hubType === 'genre' ? 55 : 70)
      .strength(0.4))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'track' ? -30 : -120))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d =>
      d.type === 'track' ? 6 : Math.max(14, Math.sqrt(d.count || 1) * 4.5)
    ));

  // Draw links coloured by hub type
  const link = g.append('g').selectAll('line')
    .data(links).join('line')
    .attr('class', 'graph-link')
    .style('stroke', d => LINK_COLOR[d.hubType] || 'rgba(255,255,255,0.05)');

  // Hub nodes
  const hubNode = g.append('g').selectAll('g.hub-node')
    .data(hubList).join('g')
    .attr('class', 'hub-node')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e,d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
    )
    .on('mouseover', (e, d) => showTip(e, `<div class="tt-title">${esc(d.name)}</div><div class="tt-sub">${LAYER_META[d.hubType].label} · ${d.count} track${d.count!==1?'s':''}</div>`))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (e, d) => {
      // Highlight all links touching this hub
      link.style('stroke', l =>
        (l.source === d || l.target === d)
          ? (LAYER_META[d.hubType].color)
          : (LINK_COLOR[l.hubType] || 'rgba(255,255,255,0.05)')
      ).style('stroke-width', l => (l.source === d || l.target === d) ? 2 : 1)
       .style('stroke-opacity', l => (l.source === d || l.target === d) ? 1 : 0.3);
      trackNode.style('opacity', n => {
        if (!n.track) return 1;
        const connected = links.some(l =>
          (l.source === d || l.target === d) &&
          (l.source === n || l.target === n)
        );
        return connected ? 1 : 0.25;
      });
    });

  hubNode.append('circle')
    .attr('r', d => Math.max(10, Math.sqrt(d.count || 1) * 4))
    .style('fill', d => LAYER_META[d.hubType].colorA)
    .style('stroke', d => LAYER_META[d.hubType].stroke)
    .style('stroke-width', 1.5);

  hubNode.append('text')
    .attr('class', 'node-label-text')
    .attr('x', d => Math.max(10, Math.sqrt(d.count || 1) * 4) + 5)
    .attr('dy', '0.35em')
    .style('fill', d => LAYER_META[d.hubType].color)
    .text(d => d.name.length > 22 ? d.name.slice(0, 20) + '…' : d.name);

  // Track nodes (small dots)
  const trackNode = g.append('g').selectAll('g.track-node')
    .data(trackNodes).join('g')
    .attr('class', 'track-node')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e,d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
    )
    .on('mouseover', (e, d) => {
      const t = d.track;
      const parts = [t.artist];
      if (t.genre) parts.push(t.genre);
      if (t.source) parts.push(t.source);
      showTip(e, `<div class="tt-title">${esc(d.name)}</div><div class="tt-sub">${parts.map(esc).join(' · ')}</div>`);
      // Dim everything except this node's connections
      link.style('stroke-opacity', l => (l.source === d || l.target === d) ? 1 : 0.15)
          .style('stroke-width',   l => (l.source === d || l.target === d) ? 2 : 1);
    })
    .on('mousemove', moveTip)
    .on('mouseout', () => {
      hideTip();
      link.style('stroke-opacity', 1).style('stroke-width', 1)
          .style('stroke', l => LINK_COLOR[l.hubType] || 'rgba(255,255,255,0.05)');
      trackNode.style('opacity', 1);
    })
    .on('click', (e, d) => { if (d.track) openDetail(d.track); });

  trackNode.append('circle')
    .attr('r', 3.5)
    .style('fill', 'rgba(200,184,154,0.55)')
    .style('stroke', 'rgba(200,184,154,0.25)')
    .style('stroke-width', 1)
    .on('mouseover', function() { d3.select(this).attr('r', 5).style('fill','var(--accent)'); })
    .on('mouseout',  function() { d3.select(this).attr('r', 3.5).style('fill','rgba(200,184,154,0.55)'); });

  // Reset click on svg background
  d3.select('#graph-svg').on('click.reset', (e) => {
    if (e.target.tagName === 'svg' || e.target.tagName === 'g') {
      link.style('stroke', l => LINK_COLOR[l.hubType] || 'rgba(255,255,255,0.05)')
          .style('stroke-width', 1).style('stroke-opacity', 1);
      trackNode.style('opacity', 1);
    }
  });

  sim.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    hubNode.attr('transform',   d => `translate(${d.x},${d.y})`);
    trackNode.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function showTip(e, html) {
  const tt = document.getElementById('graph-tooltip');
  tt.innerHTML = html;
  tt.style.display = 'block';
  tt.style.left = (e.offsetX + 14) + 'px';
  tt.style.top  = (e.offsetY - 10) + 'px';
}
function moveTip(e) {
  const tt = document.getElementById('graph-tooltip');
  tt.style.left = (e.offsetX + 14) + 'px';
  tt.style.top  = (e.offsetY - 10) + 'px';
}
function hideTip() {
  document.getElementById('graph-tooltip').style.display = 'none';
}

// ── Render all ──
function renderAll() {
  if (activePanel === 'timeline') renderTimeline();
  else if (activePanel === 'labels') renderGroupPanel('labels');
  else if (activePanel === 'sources') renderGroupPanel('sources');
  else if (activePanel === 'graph' && graphInit) initGraph();
  document.getElementById('track-count').textContent = `${filtered(TRACKS).length} tracks`;
}

// ── Init ──
renderTimeline();
renderGroupPanel('labels');
renderGroupPanel('sources');
document.getElementById('track-count').textContent = `${TRACKS.length} tracks`;
</script>
</body>
</html>
